[ESP32_C3_SuperMini_SX1278]
extends = esp32_base
board = seeed_xiao_esp32c3

build_flags =
    ${esp32_base.build_flags}
    -I variants/esp32_c3_supermini_sx1278

    -D ESP32_CPU_FREQ=80

    -D RADIO_CLASS=CustomSX1278
    -D WRAPPER_CLASS=CustomSX1278Wrapper

    -D P_LORA_DIO_0=1
    -D P_LORA_NSS=7
    -D P_LORA_RESET=3
    -D P_LORA_SCLK=4
    -D P_LORA_MISO=5
    -D P_LORA_MOSI=6

    ;BOOT BUTTON not used
    -D P_LORA_DIO_1=9 

    -D SX127X_CURRENT_LIMIT=120
    -D LORA_TX_POWER=17

    ; user button: momentary switch from GPIO10 to GND (internal pull-up)
    ; short press = zero-hop advert, hold 3s = flood advert
    -D PIN_USER_BTN=10
    -D USER_BTN_PRESSED=LOW
    -D BTN_ADVERT_LONG_PRESS_MS=3000
    -D BTN_ADVERT_MIN_INTERVAL_MS=10000


    ; 433 MHz MeshCore radio parameters
    -D LORA_FREQ=433.175
    -D LORA_BW=62.5
    -D LORA_SF=8

build_src_filter = ${esp32_base.build_src_filter}
    +<../variants/esp32_c3_supermini_sx1278>

lib_deps =
    ${esp32_base.lib_deps}

[env:ESP32_C3_SuperMini_SX1278_repeater]
extends = ESP32_C3_SuperMini_SX1278

build_flags =
    ${ESP32_C3_SuperMini_SX1278.build_flags}
    -D ADVERT_NAME='"C3 SX1278 Repeater"'
    -D ADVERT_LAT=0.0
    -D ADVERT_LON=0.0
    -D ADMIN_PASSWORD='"password"'
    -D MAX_NEIGHBOURS=50

build_src_filter = ${ESP32_C3_SuperMini_SX1278.build_src_filter}
    +<../examples/simple_repeater>

lib_deps =
    ${ESP32_C3_SuperMini_SX1278.lib_deps}
    ${esp32_ota.lib_deps}

[env:ESP32_C3_SuperMini_SX1278_companion_radio_ble]
extends = ESP32_C3_SuperMini_SX1278

build_flags =
    ${ESP32_C3_SuperMini_SX1278.build_flags}
    -D MAX_CONTACTS=350
    -D MAX_GROUP_CHANNELS=40
    -D BLE_PIN_CODE=123456
    -D OFFLINE_QUEUE_SIZE=256

build_src_filter = ${ESP32_C3_SuperMini_SX1278.build_src_filter}
    +<../examples/companion_radio/*.cpp>
    +<helpers/esp32/*.cpp>

lib_deps =
    ${ESP32_C3_SuperMini_SX1278.lib_deps}
    ${esp32_ota.lib_deps}
    densaugeo/base64 @ ~1.4.0

[env:ESP32_C3_SuperMini_SX1278_companion_radio_usb]
extends = ESP32_C3_SuperMini_SX1278

build_flags =
    ${ESP32_C3_SuperMini_SX1278.build_flags}
    -D MAX_CONTACTS=350
    -D MAX_GROUP_CHANNELS=40
    -D OFFLINE_QUEUE_SIZE=256
    -D ENABLE_USB_INTERFACE

build_src_filter = ${ESP32_C3_SuperMini_SX1278.build_src_filter}
    +<../examples/companion_radio/*.cpp>
    +<helpers/esp32/*.cpp>

lib_deps =
    ${ESP32_C3_SuperMini_SX1278.lib_deps}
    ${esp32_ota.lib_deps}
    densaugeo/base64 @ ~1.4.0

[env:ESP32_C3_SuperMini_SX1278_kiss_modem]
extends = ESP32_C3_SuperMini_SX1278

build_src_filter = ${ESP32_C3_SuperMini_SX1278.build_src_filter}
    +<../examples/kiss_modem/>
